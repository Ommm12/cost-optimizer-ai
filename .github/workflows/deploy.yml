name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: SSH into EC2
      uses: appleboy/ssh-action@master
      with:
        host: 54.224.187.94
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd ~/cost-optimizer-ai
          git pull origin main
          pm2 restart dashboard
